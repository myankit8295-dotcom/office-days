:root{
  --bg:#EAEFF3;--surface:#FFFFFF;--surface-2:#F2F5F8;
  --ink:#172335;--ink-2:#4A5A6D;--ink-3:#748294;--line:#DCE3EA;
  --green:#12804F;--green-strong:#0E6B41;--green-soft:#DDF1E6;--green-track:#C9E7D6;--on-green:#FFFFFF;--link:#0E6B41;
  --amber:#8F5300;--amber-soft:#FCEED4;
  --leave:#8B97A5;--leave-soft:#DFE5EC;
  --danger:#B23A28;--danger-soft:#FBE2DD;
  --focus:#2563EB;
  --shadow:0 1px 0 rgba(23,35,53,.04),0 10px 28px -16px rgba(23,35,53,.28);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B131D;--surface:#131E2C;--surface-2:#1A2738;
  --ink:#E7EDF4;--ink-2:#A9B6C4;--ink-3:#7A899B;--line:#243347;
  --green:#36B57C;--green-strong:#2E9E6B;--green-soft:#173628;--green-track:#1E4434;--on-green:#04170E;--link:#5BCB97;
  --amber:#F2B65A;--amber-soft:#3A2A10;
  --leave:#7C8A9A;--leave-soft:#253345;
  --danger:#F28472;--danger-soft:#3E1E19;
  --focus:#8AB4FF;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{display:block}
.muted{color:var(--ink-3)}
.link{color:var(--link);font-weight:650;font-size:15px;padding:8px 2px;white-space:nowrap}

/* hero */
.hero{position:relative;height:calc(env(safe-area-inset-top) + 330px);overflow:hidden;border-radius:0 0 30px 30px;color:#fff;isolation:isolate;background:#12233B}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg>svg{width:100%;height:100%}
.hero.ph-day{color:#0F2238}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,12,22,.66) 0%,rgba(6,12,22,.28) 58%,rgba(6,12,22,.5) 100%)}
.hero-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 0 18px}
.brand{display:flex;align-items:center;gap:7px;font-weight:650;font-size:16px}
.hero-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero.ph-day .icon-btn{background:rgba(255,255,255,.55)}
.hero-copy{padding:16px 20px 0;max-width:66%}
.hero:not(.ph-day) .hero-copy{text-shadow:0 1px 16px rgba(0,0,0,.3)}
.hero-num{font-size:88px;line-height:.84;font-weight:700;letter-spacing:-.045em}
.hero-label{margin-top:12px;font-size:18px;line-height:1.22;font-weight:500}
.tw.rise{animation:winOn .55s ease-out both}
.tw.pop{animation:winPop 1.4s ease-out both}
@keyframes winOn{from{opacity:0}to{opacity:1}}
@keyframes winPop{0%{opacity:0}25%{opacity:1}45%{opacity:.55}65%{opacity:1}100%{opacity:1}}
.flag.rise{transform-box:fill-box;transform-origin:0 50%;animation:flagUp 1s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes flagUp{from{transform:translateY(22px) scaleX(.15);opacity:0}to{transform:none;opacity:1}}

/* install */
.install{margin:14px 16px 0;padding:12px 8px 12px 16px;border-radius:16px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35;box-shadow:var(--shadow)}
.install b{font-weight:650}
.install div{flex:1;padding-top:2px}
.x{width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink-3)}

/* status */
.status{margin:16px 16px 0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 16px 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr}
.kpi{padding:0 12px}
.kpi:first-child{padding-left:2px}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi-label{font-size:13.5px;color:var(--ink-2)}
.kpi-value{font-size:27px;font-weight:650;letter-spacing:-.02em;margin-top:1px;line-height:1.15}
.kpi-value small{font-size:15px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.meter-wrap{position:relative;margin-top:30px}
.meter{display:flex;gap:3px;height:12px}
.meter i{flex:1;border-radius:3px;background:var(--green-track)}
.meter i.on{background:var(--green)}
.meter.bar{background:var(--green-track);border-radius:6px;overflow:hidden}
.meter.bar i{flex:none;border-radius:0;background:var(--green)}
.mark{position:absolute;top:-7px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.mark span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:12.5px;font-weight:650;white-space:nowrap}
.meter-cap{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink-3)}

/* today */
.today-card{margin:12px 16px 0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px 16px}
.loc{display:flex;align-items:flex-start;gap:12px}
.loc-dot{position:relative;width:10px;height:10px;border-radius:50%;margin:6px 2px 0;background:var(--ink-3);flex:none}
.loc.inside .loc-dot{background:var(--green);box-shadow:0 0 0 5px var(--green-soft)}
.loc.warn .loc-dot{background:var(--amber)}
.loc.busy .loc-dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.loc-text{flex:1;min-width:0;font-size:15.5px;line-height:1.35}
.loc-title{font-weight:600}
.loc-sub{font-size:14px;color:var(--ink-2);margin-top:2px}
.primary{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:14px;min-height:54px;border-radius:16px;background:var(--green);color:var(--on-green);font-weight:650;font-size:17px;padding:0 16px;transition:transform .12s}
.primary:active{transform:scale(.98)}
.primary.soft{background:var(--green-soft);color:var(--green-strong)}
@media (prefers-color-scheme:dark){.primary.soft{color:var(--link)}}
.primary.leave{background:var(--surface-2);color:var(--ink-2)}
.note{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--surface-2);color:var(--ink-2);font-size:15.5px;text-align:center}

/* sections */
.section{margin:30px 16px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 10px}
.section h2{font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0;line-height:1.2}
.lead{margin:-2px 4px 12px;color:var(--ink-2);font-size:15.5px;line-height:1.4}

/* calendar */
.cal-nav{display:flex;gap:8px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.cal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:10px 8px 10px 4px;touch-action:pan-y}
.cal-grid{display:grid;grid-template-columns:24px repeat(7,1fr);row-gap:2px}
.cal-wd{font-size:12.5px;color:var(--ink-3);text-align:center;padding:4px 0 6px;font-weight:500}
.cal-wk{font-size:11px;color:var(--ink-3);display:grid;place-items:center;opacity:.75}
.day{height:46px;width:100%;display:grid;place-items:center;font-size:16.5px;font-weight:500;border-radius:12px}
.day .n{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.day.we .n{color:var(--ink-3)}
.day.past:not(.office):not(.we):not(.hol) .n{color:var(--ink-2)}
.day.hol .n{color:var(--amber);background:var(--amber-soft);font-weight:600}
.day.leave .n{color:var(--ink-3);background:repeating-linear-gradient(135deg,var(--leave-soft) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--leave-soft)}
.day.office .n{background:var(--green);color:var(--on-green);font-weight:650}
.day.plan .n{box-shadow:inset 0 0 0 2px var(--green);color:var(--green-strong);font-weight:650}
@media (prefers-color-scheme:dark){.day.plan .n{color:var(--link)}}
.day.sug .n::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--green)}
.day.today .n{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.day.today.plan .n{box-shadow:inset 0 0 0 2px var(--green),0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.day.out{pointer-events:none}
.cal-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px 0;font-size:15px;color:var(--ink-2)}
.cal-tools.on{margin:10px 0 0;padding:6px 6px 6px 14px;border-radius:16px;background:var(--green-soft);color:var(--green-strong);font-weight:600}
@media (prefers-color-scheme:dark){.cal-tools.on{color:var(--link)}}
.pill{min-height:40px;padding:0 16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-size:14.5px;font-weight:650;color:var(--ink);white-space:nowrap}
.cal-tools.on .pill{background:var(--green);color:var(--on-green);box-shadow:none}
.cal.marking{box-shadow:0 0 0 2px var(--green),var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 6px 0;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.office{background:var(--green)}
.sw.plan{box-shadow:inset 0 0 0 2px var(--green)}
.sw.sug{width:7px;height:7px;background:var(--green);margin:0 3.5px}
.sw.hol{background:var(--amber-soft);box-shadow:inset 0 0 0 1.5px var(--amber)}
.sw.leave{background:repeating-linear-gradient(135deg,var(--leave) 0 2px,transparent 2px 4px)}

/* plan */
.weeks{background:var(--surface);border-radius:22px}
.week{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;align-items:center;gap:12px;padding:12px 14px 12px 16px}
.week+.week{border-top:1px solid var(--line)}
.week-name{font-weight:600;font-size:15.5px}
.week-dates{font-size:13px;color:var(--ink-3)}
@media (max-width:370px){.week{gap:8px;padding:12px 12px 12px 14px;grid-template-columns:minmax(0,1fr) auto 52px}.dots{gap:4px}.dot{width:22px;height:22px}}
.dots{display:flex;gap:5px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface-2)}
.dot.office{background:var(--green);color:var(--on-green)}
.dot.go{background:var(--green-soft);box-shadow:inset 0 0 0 2px var(--green);color:var(--green-strong)}
@media (prefers-color-scheme:dark){.dot.go{color:var(--link)}}
.dot.hol{background:var(--amber-soft);color:var(--amber)}
.dot.leave{background:repeating-linear-gradient(135deg,var(--leave-soft) 0 3px,transparent 3px 6px)}
.dot.past{opacity:.6}
.dot.outp{background:none;opacity:.35}
.dot.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.dot.today.go{box-shadow:inset 0 0 0 2px var(--green),0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.week-go{font-size:14.5px;font-weight:650;text-align:right;white-space:nowrap}
.week-go.quiet{font-weight:500;color:var(--ink-3)}
.week.more{grid-template-columns:1fr auto;color:var(--ink-2);font-size:14.5px}

/* what-if */
.sim{background:var(--surface);border-radius:22px;padding:14px 16px 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:13px;padding:3px}
.seg button{min-height:38px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:#2A3B52}}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 12px}
.step-btn{width:48px;height:48px;border-radius:50%;background:var(--surface-2);font-size:26px;line-height:1;display:grid;place-items:center;font-weight:500}
.step-btn:disabled{opacity:.35;cursor:default}
.step-val{text-align:center;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.step-val small{display:block;font-size:13.5px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-top:4px}
.sim-result{margin:0 2px;font-size:16px;line-height:1.4}
.sim-result.bad{color:var(--danger)}
.sim-bar{display:flex;gap:2px;height:14px;margin-top:14px}
.sim-bar i{flex:1;border-radius:3px;min-width:2px}
.sim-bar .go{background:var(--green)}
.sim-bar .free{background:var(--green-track)}
.sim-bar .skip{background:repeating-linear-gradient(135deg,var(--leave) 0 2px,var(--leave-soft) 2px 5px)}
.sim-bar .miss{background:repeating-linear-gradient(135deg,var(--danger) 0 2px,var(--danger-soft) 2px 5px)}
.sim-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.sim-legend span{display:inline-flex;align-items:center;gap:6px}
.sim-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* holidays */
.hols{background:var(--surface);border-radius:22px}
.hol-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px}
.hol-row+.hol-row{border-top:1px solid var(--line)}
.hol-name{font-weight:600}
.hol-en{font-size:13.5px;color:var(--ink-3)}
.hol-date{font-size:14.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.hol-date small{display:block;font-size:12.5px;color:var(--ink-3)}

.foot{margin:26px 20px 0;font-size:13.5px;color:var(--ink-3);text-align:center}
.foot p{margin:0}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(6,12,22,.46);opacity:0;transition:opacity .22s;z-index:50}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:51;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-size:22px;font-weight:650;margin:0;letter-spacing:-.015em}
.sheet-sub{color:var(--ink-3);font-size:14.5px;margin:2px 0 12px}
.sheet-note{margin:10px 0 4px;padding:14px 16px;border-radius:16px;background:var(--surface-2);color:var(--ink-2)}
.sheet-foot{margin:12px 2px 2px;font-size:14px;color:var(--ink-3)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;background:var(--surface-2);margin-top:8px;text-align:left;font-size:16.5px;font-weight:550}
.opt small{display:block;font-size:13.5px;font-weight:500;color:var(--ink-3);margin-top:1px}
.welcome .primary{margin-top:24px}
.welcome .sheet-sub{font-size:15.5px;line-height:1.4;color:var(--ink-2);margin-top:8px}
.opt .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--green-soft);box-shadow:inset 0 0 0 2px var(--green)}
.opt.office .ic,.opt.plan .ic{color:var(--green)}
.opt[aria-pressed="true"] .ic{background:var(--green);color:var(--on-green)}
.opt.leave[aria-pressed="true"]{background:var(--leave-soft);box-shadow:inset 0 0 0 2px var(--leave)}
.opt.leave[aria-pressed="true"] .ic{background:var(--leave);color:#fff}
.close-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.close{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}

/* settings */
.set-group{margin-top:20px}
.set-label{font-size:14px;color:var(--ink-2);margin:0 2px 8px;font-weight:500}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:14px}
.set-row+.set-row{margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:44px;min-height:40px;padding:0 13px;border-radius:12px;background:var(--surface-2);font-size:15px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.mini-step{display:flex;align-items:center;gap:6px}
.mini-step button{width:38px;height:38px;border-radius:50%;background:var(--surface);font-size:22px;line-height:1}
.mini-step output{min-width:56px;text-align:center;font-size:20px;font-weight:650}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.spot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface-2);border-radius:14px;margin-top:6px}
.spot-name{font-weight:600}
.spot-sub{font-size:13px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--surface-2);font-weight:600;font-size:15.5px}
.btn.wide{width:100%;margin-top:8px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
textarea{width:100%;min-height:120px;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
.help h4{font-size:17px;margin:20px 0 4px;font-weight:650}
.help p{margin:0 0 6px;color:var(--ink-2);font-size:15.5px;line-height:1.45}
.help ol{margin:4px 0 6px;padding-left:20px;color:var(--ink-2);font-size:15.5px;line-height:1.5}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-top">
      <div class="brand">
        <svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true"><rect x="5.5" y="7" width="10" height="13" rx="1.3" fill="currentColor" opacity=".3"/><g fill="#FFC95E"><rect x="7.2" y="16.4" width="2.6" height="1.9" rx=".4"/><rect x="11.2" y="16.4" width="2.6" height="1.9" rx=".4"/><rect x="7.2" y="13" width="2.6" height="1.9" rx=".4"/><rect x="11.2" y="13" width="2.6" height="1.9" rx=".4"/></g><g fill="currentColor" opacity=".55"><rect x="7.2" y="9.6" width="2.6" height="1.9" rx=".4"/><rect x="11.2" y="9.6" width="2.6" height="1.9" rx=".4"/></g><path d="M14.8 7V2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M15.3 2.4l4.4 1.5-4.4 1.5z" fill="#36B57C"/></svg>
        <span>Office Days</span>
      </div>
      <div class="hero-actions">
        <button class="icon-btn" data-act="help" aria-label="Help"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.9.7c0 1.8-2.5 2.1-2.5 3.9"/><circle cx="12" cy="17.3" r=".7" fill="currentColor" stroke="none"/></svg></button>
        <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
      </div>
    </div>
    <div class="hero-copy" id="heroCopy"></div>
  </header>

  <div id="installBanner"></div>
  <section class="status" id="status" aria-label="Progress"></section>
  <section class="today-card" id="today" aria-label="Today"></section>

  <section class="section" id="calSec">
    <div class="section-head">
      <h2 id="calTitle"></h2>
      <div class="cal-nav">
        <button class="round" data-act="prevM" aria-label="Previous month"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
        <button class="round" data-act="nextM" aria-label="Next month"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
    <div id="calTools"></div>
    <div class="legend" aria-hidden="true">
      <span><i class="sw office"></i>Office day</span>
      <span><i class="sw plan"></i>Planned</span>
      <span><i class="sw sug"></i>Suggested</span>
      <span><i class="sw hol"></i>Holiday</span>
      <span><i class="sw leave"></i>Leave</span>
    </div>
  </section>

  <section class="section" id="planSec"></section>
  <section class="section" id="simSec"></section>
  <section class="section" id="holSec"></section>
  <footer class="foot" id="foot"></footer>
</div>

<div class="backdrop" id="backdrop" data-act="close" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

  var list = [

  if (st.status === 'none') { el.innerHTML = ''; return; }
  if (st.status === 'done') lead = st.past ? 'You reached your target. Nice work.' : 'You’ve reached ' + S().target + '% ' + pIn(st.p, now) + '. Any extra day is a bonus.';
  else if (st.status === 'missed') lead = 'This period is over. You were in the office ' + st.D + ' of ' + st.W + ' working days.';
  else if (st.status === 'short') lead = 'Even if you go every day that’s left, you’ll end at ' + Math.round(st.maxPct * 100) + '%. If you were on leave or sick, mark those days so they don’t count.';
  else lead = 'Go ' + perWeekText(st.R, st.A) + '. Suggested days have a green dot in the calendar. Tap any day to plan it.';
  var start = (st.past || st.future) ? mondayOf(st.p.start) : mondayOf(now);
  var rows = '', shown = 0, moreGo = 0, moreWeeks = 0;
  for (var d = start; d <= st.p.end; d = addD(d, 7)) {
    if (shown < 6) { rows += weekRow(d, st, sug, tK); shown++; }
    else {
      moreWeeks++;
      for (var n = 0; n < 5; n++) { var x = addD(d, n), xi = info(x); if (K(x) <= K(st.p.end) && (xi.plan || sug[xi.k])) moreGo++; }
    }
  }
  if (moreWeeks) rows += '<div class="week more"><span>Later: ' + moreWeeks + ' more ' + plural(moreWeeks, 'week', 'weeks') + '</span><span class="week-go">' + (moreGo ? 'Go ' + moreGo : 'Free') + '</span></div>';
  el.innerHTML = '<div class="section-head"><h2>' + (st.past ? 'How it went' : 'Your plan') + '</h2></div><p class="lead">' + lead + '</p><div class="weeks">' + rows + '</div>';
}

function renderSim(st) {
  var el = $('#simSec');
  if (st.past || st.status === 'none' || st.A === 0) { el.innerHTML = ''; return; }
  var mode = state.ui.simMode;
  simK = clamp(simK, 0, st.A);
  var r = whatIf(st, simK, mode), text, bad = false;
  var leaveWord = mode === 'leave' ? 'leave' : 'home';
  if (st.status === 'done' && r.R2 === 0) text = simK ? 'Still fine. You’ve already reached the target.' : 'You’ve already reached the target, so you can skip any day that’s left.';
  else if (!r.ok) { bad = true; text = 'Too many. You’d be ' + r.short + ' ' + plural(r.short, 'day', 'days') + ' short and end at ' + Math.round(r.maxPct * 100) + '%.'; }
  else if (!simK) text = 'Right now you need ' + st.R + ' of the next ' + st.A + ' working days. You can skip up to ' + st.skip + '.';
  else if (mode === 'leave') text = 'Your target drops to ' + r.T2 + ' days. You’d need ' + r.R2 + ' of the ' + r.A2 + ' days left' + (r.R2 ? ' (' + perWeekText(r.R2, r.A2) + ')' : '') + '.';
  else text = 'You’d need ' + r.R2 + ' of the ' + r.A2 + ' days left' + (r.R2 ? ', so ' + perWeekText(r.R2, r.A2) : '') + '.' + (r.free ? ' You could still skip ' + r.free + ' more.' : ' No more skipping after that.');
  var cells = '';
  if (r.ok) {
    for (var a = 0; a < r.R2; a++) cells += '<i class="go"></i>';
    for (var b = 0; b < r.free; b++) cells += '<i class="free"></i>';
    for (var c = 0; c < simK; c++) cells += '<i class="skip"></i>';
  } else {
    for (var e = 0; e < r.A2; e++) cells += '<i class="go"></i>';
    for (var f = 0; f < simK; f++) cells += '<i class="' + (f >= simK - r.short ? 'miss' : 'skip') + '"></i>';
  }
  el.innerHTML = '<div class="section-head"><h2>What if I skip days?</h2></div>' +
    '<div class="sim">' +
      '<div class="seg" role="group" aria-label="Kind of day off">' +
        '<button data-act="simMode" data-mode="wfh" aria-pressed="' + (mode === 'wfh') + '">Work from home</button>' +
        '<button data-act="simMode" data-mode="leave" aria-pressed="' + (mode === 'leave') + '">Take leave</button>' +
      '</div>' +
      '<div class="stepper">' +
        '<button class="step-btn" data-act="simDec" aria-label="One day fewer"' + (simK <= 0 ? ' disabled' : '') + '>−</button>' +
        '<div class="step-val">' + simK + '<small>' + plural(simK, 'day', 'days') + ' at ' + leaveWord + '</small></div>' +
        '<button class="step-btn" data-act="simInc" aria-label="One day more"' + (simK >= st.A ? ' disabled' : '') + '>+</button>' +
      '</div>' +
      '<p class="sim-result' + (bad ? ' bad' : '') + '" aria-live="polite">' + text + '</p>' +
      '<div class="sim-bar" aria-hidden="true">' + cells + '</div>' +
      '<div class="sim-legend" aria-hidden="true"><span><i style="background:var(--green)"></i>Office</span><span><i style="background:var(--green-track)"></i>Free to skip</span><span><i style="background:repeating-linear-gradient(135deg,var(--leave) 0 2px,var(--leave-soft) 2px 5px)"></i>' + (mode === 'leave' ? 'Leave' : 'Skipped') + '</span>' + (bad ? '<span><i style="background:repeating-linear-gradient(135deg,var(--danger) 0 2px,var(--danger-soft) 2px 5px)"></i>Over the limit</span>' : '') + '</div>' +
    '</div>';
}

function openDay(k) {

function setDay(k, v) {

/* ============ actions ============ */
var toastTimer = null;
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function copyText(text, okMsg) {
  var done = function () { toast(okMsg); };
  var fallback = function () {
    var box = $('#restoreBox');
    if (!box) { openSheet('text', head('Copy this', '') + '<div id="restoreBox"></div>'); box = $('#restoreBox'); }
    if (box) { box.innerHTML = '<textarea readonly aria-label="Backup text">' + esc(text) + '</textarea><p class="sheet-foot">Copy this text and keep it somewhere safe.</p>'; var ta = box.querySelector('textarea'); ta.focus(); ta.select(); }
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
function addSpotHere() {
  var add = function (lat, lng, acc) {
    S().spots.push({ name: S().spots.length ? 'My office ' + (S().spots.length + 1) : 'My office', lat: +lat.toFixed(6), lng: +lng.toFixed(6) });
    save(); if (sheetKind === 'welcome') openWelcome(); else if (sheetKind === 'settings') openSettings(); else renderAll();
    toast('Saved. This is now your office location.');
    onPos({ coords: { latitude: lat, longitude: lng, accuracy: acc } });
  };
  if (!GEO_OK) { toast('Location isn’t available here.'); return; }
  if (loc.pos && loc.pos.acc <= 100 && loc.at && (Date.now() - loc.at) < 120000) { add(loc.pos.lat, loc.pos.lng, loc.pos.acc); return; }
  toast('Finding your location…');
  navigator.geolocation.getCurrentPosition(function (p) {
    if (p.coords.accuracy > 150) { toast('Location isn’t precise enough. Try again near a window.'); return; }
    add(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
  }, function (err) { toast(err && err.code === 1 ? 'Location is blocked. See Help.' : 'Couldn’t get your location.'); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}
function handlePhoto(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxW = 1000, scale = Math.min(1, maxW / img.width), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var url = cv.toDataURL('image/jpeg', 0.78);
      try { localStorage.setItem(PHOTO_KEY, url); heroKey = ''; renderAll(); if (sheetKind === 'settings') openSettings(); toast('Photo saved'); }
      catch (e) { toast('Couldn’t save the photo here.'); }
    };
    img.onerror = function () { toast('That file isn’t a picture I can use.'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), now = new Date(), st;
  switch (act) {
    case 'close': if (sheetKind === 'welcome') finishWelcome(false); else closeSheet(); break;
    case 'help': openHelp(); break;
    case 'settings': openSettings(); break;
    case 'prevM': shiftMonth(-1); break;
    case 'nextM': shiftMonth(1); break;
    case 'day': if (markMode && b.classList.contains('day')) quickToggle(b.getAttribute('data-k')); else openDay(b.getAttribute('data-k')); break;
    case 'markOn': markMode = true; renderAll(); toast('Tap each day you were in the office.'); break;
    case 'markOff': markMode = false; renderAll(); break;
    case 'share': shareApp(); break;
    case 'wOffice':
      if (b.getAttribute('data-v') === 'other') { welcomeOther = true; if (sameSpots(S().spots, DEFAULT_SPOTS)) S().spots = []; }
      else { welcomeOther = false; S().spots = DEFAULT_SPOTS.map(function (x) { return { name: x.name, lat: x.lat, lng: x.lng }; }); }
      save(); recheck(); openWelcome(); break;
    case 'wTgt': S().target = clamp(S().target + (+b.getAttribute('data-d')), 10, 100); save(); openWelcome(); break;
    case 'wPeriod': S().period = b.getAttribute('data-v'); save(); openWelcome(); break;
    case 'wStart': finishWelcome(true); break;
    case 'useVallila': S().spots = DEFAULT_SPOTS.map(function (x) { return { name: x.name, lat: x.lat, lng: x.lng }; }); save(); recheck(); renderAll(); openSettings(); break;
    case 'setDay': setDay(b.getAttribute('data-k'), b.getAttribute('data-v')); closeSheet(); break;
    case 'checkin':
      var tK = K(now); state.days[tK] = { s: 'office', src: 'manual', t: hhmm(now) }; state.noAuto = null;
      view = { y: now.getFullYear(), m: now.getMonth() };
      save(); renderAll(); toast('Today is logged as an office day'); break;
    case 'locOn': S().autoLoc = true; save(); startWatch(); break;
    case 'locAgain': stopWatch(); loc.state = 'locating'; renderToday(now); startWatch(); break;
    case 'hideInstall': state.ui.hideInstall = true; save(); renderInstall(); break;
    case 'simMode': state.ui.simMode = b.getAttribute('data-mode'); save(); renderSim(computeStats(viewPeriod(), now)); break;
    case 'simInc': simK++; renderSim(computeStats(viewPeriod(), now)); break;
    case 'simDec': simK--; renderSim(computeStats(viewPeriod(), now)); break;
    case 'tgt': S().target = clamp(S().target + (+b.getAttribute('data-d')), 10, 100); save(); renderAll(); openSettings(); break;
    case 'period': S().period = b.getAttribute('data-v'); simK = 0; save(); renderAll(); openSettings(); break;
    case 'pref':
      var n = +b.getAttribute('data-v'), pi = S().prefer.indexOf(n);
      if (pi >= 0) S().prefer.splice(pi, 1); else { S().prefer.push(n); S().prefer.sort(); }
      save(); renderAll(); openSettings(); break;
    case 'eves': S().eves = !S().eves; save(); renderAll(); openSettings(); break;
    case 'radius': S().radius = +b.getAttribute('data-v'); save(); recheck(); renderAll(); openSettings(); break;
    case 'spotDel': S().spots.splice(+b.getAttribute('data-i'), 1); save(); recheck(); renderAll(); openSettings(); break;
    case 'spotAdd': addSpotHere(); break;
    case 'photoPick': $('#photoInput').click(); break;
    case 'photoDel': try { localStorage.removeItem(PHOTO_KEY); } catch (e2) {} heroKey = ''; renderAll(); openSettings(); break;
    case 'backupCopy': copyText(JSON.stringify({ v: state.v, days: state.days, noAuto: state.noAuto, setup: true, settings: state.settings }), 'Backup copied. Paste it into Notes to keep it.'); break;
    case 'restoreShow':
      $('#restoreBox').innerHTML = '<textarea id="restoreText" placeholder="Paste your backup here" aria-label="Backup text"></textarea><button class="btn wide" data-act="restore">Restore</button>';
      $('#restoreText').focus(); break;
    case 'restore':
      try {
        var data = JSON.parse($('#restoreText').value);
        if (!data || typeof data.days !== 'object') throw new Error('bad');
        var keep = { autoLoc: S().autoLoc, ui: state.ui };
        state = normalize(data); state.settings.autoLoc = keep.autoLoc; state.ui = keep.ui;
        save(); renderAll(); closeSheet(); toast('Backup restored');
      } catch (e3) { toast('That doesn’t look like a backup from this app.'); }
      break;
    case 'erase':
      if (!armed) { armed = true; b.classList.add('armed'); b.textContent = 'Tap again to erase everything'; setTimeout(function () { armed = false; if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Erase all data'; } }, 4000); }
      else { var keepUi = state.ui; state = defaults(); state.ui = keepUi; try { localStorage.removeItem(PHOTO_KEY); } catch (e4) {} heroKey = ''; save(); renderAll(); closeSheet(); toast('All data erased'); }
      break;
  }
});
$('#photoInput').addEventListener('change', function (e) { handlePhoto(e.target.files && e.target.files[0]); e.target.value = ''; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (sheetKind === 'welcome') finishWelcome(false); else closeSheet(); } });

// swipe between months on the calendar
(function () {
  var cal = $('#cal'), x0 = null, y0 = null;
  cal.addEventListener('touchstart', function (e) { var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
  cal.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

// keep things fresh: new day, sky changes
setInterval(function () {
  if (document.hidden) return;
  var now = new Date();
  if (K(now) !== lastToday) { if (view.y === addD(now, -1).getFullYear() && view.m === addD(now, -1).getMonth()) view = { y: now.getFullYear(), m: now.getMonth() }; renderAll(); }
  else renderHero(computeStats(viewPeriod(), now), now);
}, 60000);

// for tests
window.__OD = { easter: easter, holidaysFor: holidaysFor, computeStats: computeStats, periodOf: periodOf, suggest: suggest, perWeekText: perWeekText, whatIf: whatIf, isoWeek: isoWeek, K: K, sunTimes: sunTimes, skyPhase: skyPhase, getState: function () { return state; } };

renderAll();
initLocation();
if (!state.setup) setTimeout(function () { if (!state.setup && sheetKind === null) openWelcome(); }, FRAMED ? 2500 : 350);
(function tryCloud(n) {
  if (window.claude && typeof window.claude.use === 'function') Cloud.init();
  else if (FRAMED && n < 4) setTimeout(function () { tryCloud(n + 1); }, [300, 1000, 2500, 5000][n]);
})(0);
})();
</script>
